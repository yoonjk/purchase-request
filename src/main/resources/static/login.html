<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구매 관리 로그인</title><link rel="stylesheet" href="/css/management.css"></head><body><main class="login"><h1>구매 관리 로그인</h1><p id="message"></p><form method="post" action="/login"><label>아이디<input name="username" autocomplete="username" required maxlength="50"></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label><input type="hidden" name="_csrf" id="csrf"><button>로그인</button></form></main><script>fetch('/api/auth/csrf').then(r=>r.json()).then(x=>document.querySelector('#csrf').value=x.token);let q=new URLSearchParams(location.search);const m=document.querySelector('#message');if(q.has('error')){const c=q.get('error');if(c==='AUTH_ERROR'){m.textContent='로그인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';m.dataset.code=c}else{m.textContent='아이디 또는 비밀번호를 확인하세요.';m.dataset.code='INVALID_CREDENTIALS'}}if(q.has('logout'))m.textContent='로그아웃되었습니다.';</script></body></html>
