server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://nexweb.ddnsgeek.com:13306}/${DB_NAME}
    username: ${DB_USERNAME:nexweb}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  # MyBatis Mapper XML; no JPA/Hibernate.

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
hub:
    admin-login-ids: ${HUB_ADMIN_LOGIN_IDS:}

logging:
  level:
    root: INFO
    com.demo.purchase: INFO
    org.mybatis: WARN
  file:
    name: ${APP_LOG_FILE:logs/purchase-request.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB		
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [correlationId=%X{requestId:-N/A}] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [correlationId=%X{requestId:-N/A}] [%thread] %logger{36} - %msg%n"